<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chronly — Time, focused.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=Sora:wght@400;600&family=Fraunces:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12141a; --card:#1a1d24; --card2:#20232b; --border:#2b2f39;
  --text:#edeef0; --muted:#8b93a1; --amber:#e8a33d; --teal:#4fd1c5; --red:#e5605a;
  --bg-rgb:18,20,26; --card-rgb:26,29,36; --card2-rgb:32,35,43; --border-rgb:43,47,57; --accent-rgb:232,163,61;
  --night-rgb:13,21,38;
  --shadow: 0 8px 24px rgba(0,0,0,.35); --shadow-sm:0 2px 8px rgba(0,0,0,.25);
  --glass-blur:0px; --glass-alpha:1; --glass-alpha2:1; --glass-border-a:1; --glass-sheen:0 0 #0000; --glass-lift:0 0 #0000; --glass-drop:0 0 #0000; --glass-bf:none;
  padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){}
:root[data-theme="light"]{
  --bg:#f7f6f3; --card:#ffffff; --card2:#f0efeb; --border:#e4e2db;
  --text:#1a1d24; --muted:#6b7280; --shadow: 0 8px 24px rgba(0,0,0,.08); --shadow-sm:0 2px 8px rgba(0,0,0,.07);
  --bg-rgb:247,246,243; --card-rgb:255,255,255; --card2-rgb:240,239,235; --border-rgb:228,226,219;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f7f6f3; --card:#ffffff; --card2:#f0efeb; --border:#e4e2db;
    --text:#1a1d24; --muted:#6b7280; --shadow: 0 8px 24px rgba(0,0,0,.08); --shadow-sm:0 2px 8px rgba(0,0,0,.07);
    --bg-rgb:247,246,243; --card-rgb:255,255,255; --card2-rgb:240,239,235; --border-rgb:228,226,219;
  }
}
/* Liquid-glass intensity levels: raising blur/lowering alpha is the only thing these do.
   [data-glass="off"] (default) leaves every surface exactly as it was — fully opaque, no blur. */
[data-glass="subtle"]{ --glass-blur:10px; --glass-alpha:.62; --glass-alpha2:.5; --glass-border-a:.55; --glass-sheen:inset 0 1px 0 rgba(255,255,255,.16); --glass-lift:var(--shadow-sm); --glass-drop:var(--shadow); --glass-bf:blur(var(--glass-blur)); }
[data-glass="medium"]{ --glass-blur:18px; --glass-alpha:.42; --glass-alpha2:.32; --glass-border-a:.4; --glass-sheen:inset 0 1px 0 rgba(255,255,255,.22); --glass-lift:var(--shadow-sm); --glass-drop:var(--shadow); --glass-bf:blur(var(--glass-blur)); }
[data-glass="strong"]{ --glass-blur:30px; --glass-alpha:.24; --glass-alpha2:.17; --glass-border-a:.26; --glass-sheen:inset 0 1px 0 rgba(255,255,255,.28); --glass-lift:var(--shadow-sm); --glass-drop:var(--shadow); --glass-bf:blur(var(--glass-blur)); }
:root{ --bg-image:none; }
#bgLayer{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;background-repeat:no-repeat;
  opacity:0;transition:opacity .5s ease}
#bgLayer.show{opacity:1}
#bgLayer::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.32)}
:root[data-theme="light"] #bgLayer::after{background:rgba(255,255,255,.4)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);
  transition:background-color .2s,color .2s,background-image .4s ease; -webkit-tap-highlight-color:transparent}
.num{font-family:var(--font-num)}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--accent,var(--amber));color:#12141a}
[data-accent="amber"]{--accent:#e8a33d}
[data-accent="teal"]{--accent:#4fd1c5}
[data-accent="purple"]{--accent:#a78bfa}
[data-accent="green"]{--accent:#5fd08a}
[data-accent="red"]{--accent:#e5605a}

#shell{display:flex;min-height:100%}
nav#side{width:230px;flex-shrink:0;padding:24px 14px;border-right:1px solid rgba(var(--border-rgb),var(--glass-border-a));
  background:rgba(var(--bg-rgb),var(--glass-alpha));backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));
  display:flex;flex-direction:column;gap:2px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.brand{font-family:var(--font-num);font-weight:700;font-size:20px;padding:0 12px 22px;display:flex;align-items:center;gap:8px}
.navbtn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;border:none;
  background:transparent;color:var(--muted);font-size:14.5px;font-weight:500;text-align:left}
.navbtn svg{width:18px;height:18px;flex-shrink:0}
.navbtn.active{background:rgba(var(--card2-rgb),var(--glass-alpha2));color:var(--text);box-shadow:var(--glass-sheen),var(--glass-lift);backdrop-filter:var(--glass-bf);-webkit-backdrop-filter:var(--glass-bf)}
.navbtn:hover{color:var(--text)}
main{flex:1;min-width:0;padding:28px 20px 100px;max-width:900px;margin:0 auto;width:100%}
.topbar{display:none}

.card{background:rgba(var(--card-rgb),var(--glass-alpha));border:1px solid rgba(var(--border-rgb),var(--glass-border-a));border-radius:16px;padding:20px;
  box-shadow:var(--glass-sheen),var(--shadow);backdrop-filter:blur(var(--glass-blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(150%)}
.section{display:none;animation:fade .25s ease}
.section.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
h1.title{font-family:var(--font-num);font-weight:600;font-size:22px;margin:0 0 4px;letter-spacing:-0.01em}
h1.title.subhead{font-size:16px;margin-top:24px;margin-bottom:0}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 20px;font-weight:400}
input,select{font-family:inherit}
/* Editable fields share the glass recipe of .empty ("No laps yet"); each spot tunes only its own alpha via --fld-*.
   With glass off every alpha resolves to 1, so fields look exactly as before. */
.fld,.field-row input,.search-wrap input,select{
  background:rgba(var(--fld-bg,var(--card2-rgb)),var(--fld-a,var(--glass-alpha2)));
  border:1px solid rgba(var(--border-rgb),var(--fld-ba,max(var(--glass-border-a),.6)));
  color:var(--text);box-shadow:var(--glass-sheen),var(--glass-lift);backdrop-filter:var(--glass-bf);-webkit-backdrop-filter:var(--glass-bf)}
select option{background:var(--card);color:var(--text)}
.modal{--fld-a:max(var(--glass-alpha2),.6);--fld-ba:max(var(--glass-border-a),.75)}
.saved-card .fld{--fld-bg:var(--card-rgb);--fld-ba:max(var(--glass-border-a),.85)}
/* dark glass: nested fields use the lighter card2 base so they read as glass, not black; glass off and light keep the original base */
[data-theme="dark"]:not([data-glass="off"]) .saved-card .fld{--fld-bg:var(--card2-rgb)}
/* Round colour pickers, like the accent dots */
input[type="color"]{-webkit-appearance:none;appearance:none;width:28px;height:28px;padding:0;margin:0;flex-shrink:0;border:2px solid var(--border);border-radius:50%;background:none;cursor:pointer;overflow:hidden}
input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
input[type="color"]::-webkit-color-swatch,input[type="color"]::-moz-color-swatch{border:none;border-radius:50%}
/* Exam stage bars: each one drains as its stage runs */
.ex-timeline{display:flex;gap:4px;width:100%;margin-top:16px}
.ex-seg{height:8px;min-width:6px;border-radius:999px;background:var(--border);overflow:hidden}
.ex-fill{height:100%;border-radius:inherit;background:var(--seg);transition:width 1s linear}
.ex-seg.next .ex-fill{opacity:.4}
.lbl{font-weight:500}
.grid{display:grid;gap:14px}
.grid.cols2{grid-template-columns:1fr 1fr}
.grid.cols3{grid-template-columns:repeat(3,1fr)}
@media(max-width:640px){.grid.cols2,.grid.cols3{grid-template-columns:1fr}}

/* Timer ring */
.ring-wrap{display:flex;flex-direction:column;align-items:center;padding:20px 0}
.ring{position:relative;width:280px;height:280px;max-width:80vw;max-height:80vw}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--border)}
.ring .fg{stroke:var(--accent,var(--amber));stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring .label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .label .t{font-family:var(--font-num);font-size:46px;font-weight:600;font-variant-numeric:tabular-nums}
.ring .label .s{color:var(--muted);font-size:12.5px;margin-top:4px}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.pulse,.section{animation:none}}

.ctrl-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(var(--border-rgb),var(--glass-border-a));background:rgba(var(--card2-rgb),var(--glass-alpha2));color:var(--text);padding:10px 18px;box-shadow:var(--glass-sheen),var(--glass-lift);backdrop-filter:var(--glass-bf);-webkit-backdrop-filter:var(--glass-bf);
  border-radius:10px;font-size:14px;font-weight:500;min-height:44px;cursor:pointer;transition:border-color .15s,transform .1s,background .15s}
.btn:hover{border-color:var(--accent,var(--amber))}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent,var(--amber));color:#12141a;border-color:transparent;font-weight:600}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn:focus-visible,.navbtn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent,var(--amber));outline-offset:2px}

.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.chip{box-shadow:var(--glass-sheen),var(--glass-lift);border:1px solid rgba(var(--border-rgb),var(--glass-border-a));background:rgba(var(--card2-rgb),var(--glass-alpha2));padding:7px 13px;border-radius:20px;font-size:13px;font-weight:500;color:var(--text);
  backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));transition:border-color .15s,transform .1s}
.chip:active{transform:scale(.96)}
.chip:hover{border-color:var(--accent,var(--amber))}

.field-row{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:10px}
.field-row input{width:64px;text-align:center;padding:8px;border-radius:8px;font-size:16px;font-family:var(--font-num)}

.saved-card{box-shadow:var(--glass-sheen),var(--glass-lift);background:rgba(var(--card2-rgb),var(--glass-alpha2));border:1px solid rgba(var(--border-rgb),var(--glass-border-a));border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center;
  backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur))}
.saved-card .name{font-weight:600;font-size:14.5px}
.saved-card .dur{color:var(--muted);font-size:12.5px}
.icon-btn{background:none;border:none;color:var(--muted);padding:6px;border-radius:8px}
.icon-btn:hover{color:var(--text);background:rgba(var(--border-rgb),max(var(--glass-alpha2),.5))}
.empty{text-align:center;color:var(--muted);padding:32px 16px;font-size:14px;box-shadow:var(--glass-sheen),var(--glass-lift);
  background:rgba(var(--card2-rgb),var(--glass-alpha2));border:1px solid rgba(var(--border-rgb),var(--glass-border-a));border-radius:12px;
  backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur))}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}

/* Pomodoro */
.dots{display:flex;gap:8px;justify-content:center;margin-top:14px}
.dots span{width:10px;height:10px;border-radius:50%;background:var(--border)}
.dots span.done{background:var(--accent,var(--amber))}
.statline{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;padding:8px 0;border-top:1px solid var(--border)}
.statline b{color:var(--text);font-weight:600}
.progress-bar{height:8px;background:var(--border);border-radius:999px;overflow:hidden;margin-top:6px}
.progress-bar>div{height:100%;background:var(--accent,var(--amber));border-radius:inherit}

/* World Clock */
.wc-card{padding:16px;border-radius:14px;border:1px solid rgba(var(--border-rgb),var(--glass-border-a));
  backdrop-filter:blur(var(--glass-blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(150%);box-shadow:var(--glass-sheen),var(--glass-drop)}
.wc-card.day{background:linear-gradient(160deg,rgba(var(--card-rgb),var(--glass-alpha)),rgba(var(--card2-rgb),var(--glass-alpha2)))}
.wc-card.night{background:rgba(var(--night-rgb),var(--glass-alpha));border-color:rgba(34,48,74,var(--glass-border-a))}
.wc-card .city{font-weight:600;font-size:15px}
.wc-card .ctry{color:var(--muted);font-size:12px}
.wc-card .time{font-family:var(--font-num);font-size:30px;margin-top:8px}
.wc-card .meta{color:var(--muted);font-size:12px;margin-top:2px}
.search-wrap{position:relative}
.search-wrap input{width:100%;padding:12px 14px;border-radius:10px;font-size:14px;--fld-a:var(--glass-alpha)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:rgba(var(--card-rgb),max(var(--glass-alpha),.88));border:1px solid rgba(var(--border-rgb),var(--glass-border-a));
  border-radius:10px;box-shadow:var(--glass-sheen),var(--shadow);max-height:260px;overflow:auto;z-index:5;backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur))}
.results button{display:block;width:100%;text-align:left;padding:10px 14px;background:none;border:none;color:var(--text);font-size:13.5px}
.results button:hover{background:rgba(var(--card2-rgb),max(var(--glass-alpha2),.5))}

/* Alarms */
.alarm-row{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--border)}
.alarm-row:last-child{border-bottom:none}
.alarm-row .time{font-family:var(--font-num);font-size:26px;min-width:110px}
.alarm-row .meta{flex:1;font-size:12.5px;color:var(--muted)}
.switch{position:relative;width:44px;height:26px;flex-shrink:0}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;inset:0;cursor:pointer;z-index:1}
.switch .track{position:absolute;inset:0;background:var(--border);border-radius:20px;transition:.2s;pointer-events:none}
.switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked + .track{background:var(--accent,var(--amber))}
.switch input:checked ~ .knob{transform:translateX(18px)}
.days{display:flex;gap:5px;margin-top:4px}
.days span{width:20px;height:20px;border-radius:50%;background:var(--card2);color:var(--muted);font-size:10px;
  display:flex;align-items:center;justify-content:center}
.days span.on{background:var(--accent,var(--amber));color:#12141a}

/* Settings */
.set-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:none}
.set-row .lbl{font-size:14px}
.set-row .desc{color:var(--muted);font-size:12px;margin-top:2px}
select{padding:8px 10px;border-radius:8px;font-size:13.5px}
.swatch-row{display:flex;gap:8px}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.swatch.sel{border-color:var(--text)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg.show{display:flex}
.modal{background:rgba(var(--card-rgb),max(var(--glass-alpha),.85));border:1px solid rgba(var(--border-rgb),var(--glass-border-a));border-radius:16px;padding:24px;max-width:380px;width:100%;
  box-shadow:var(--glass-sheen),var(--shadow);backdrop-filter:blur(var(--glass-blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(150%)}
.modal h3{margin:0 0 8px;font-family:var(--font-num)}
.modal p{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.modal .row{display:flex;gap:10px;justify-content:flex-end}

/* Alarm overlay */
#alarmOverlay{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;text-align:center;padding:20px}
#alarmOverlay.show{display:flex}
#alarmOverlay .big{font-family:var(--font-num);font-size:64px}

/* bottom nav (mobile) */
nav#bottom{display:none}
@media(max-width:860px){
  nav#side{display:none}
  nav#bottom{display:flex;position:fixed;bottom:0;left:0;right:0;
    background:rgba(var(--card-rgb),var(--glass-alpha));backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));
    border-top:1px solid rgba(var(--border-rgb),var(--glass-border-a));box-shadow:var(--glass-sheen);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:20;justify-content:space-around}
  nav#bottom button{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;min-width:44px;min-height:44px;justify-content:center}
  nav#bottom button.active{color:var(--accent,var(--amber))}
  nav#bottom svg{width:20px;height:20px}
  main{padding-bottom:90px}
}
.home-hero{padding:26px 4px 10px}
.home-hero .time{font-family:var(--font-num);font-size:52px}
.home-hero .greet{color:var(--muted);font-size:14px;margin-top:2px}
.home-item{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--border)}
.home-item:last-child{border-bottom:none}
.home-item .l{color:var(--muted);font-size:12.5px}
.home-item .v{font-weight:600;font-size:15px;margin-top:2px}
/* ===== Tinted-glass accent + fonts ===== */
:root{--font-body:'Inter',system-ui,sans-serif;--font-num:'Space Grotesk',system-ui,sans-serif}
/* accent = tinted glass (primary buttons) */
.btn.primary{background:linear-gradient(165deg,rgba(var(--accent-rgb),.82),rgba(var(--accent-rgb),.44));color:var(--text);border:1px solid rgba(255,255,255,.32);
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.6),inset 0 -10px 16px -8px rgba(var(--accent-rgb),.55),0 8px 22px -8px rgba(var(--accent-rgb),.6);backdrop-filter:blur(8px) saturate(180%);-webkit-backdrop-filter:blur(8px) saturate(180%)}
.btn.primary:hover{border-color:rgba(255,255,255,.5)}
.navbtn.active{background:linear-gradient(165deg,rgba(var(--accent-rgb),.28),rgba(var(--accent-rgb),.1));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),var(--glass-sheen),var(--glass-lift)}
/* ===== Rings, bars, sliders, toggles: plain in every mode except Ultra =====
   Off, Subtle, Medium and Strong get ordinary flat controls: solid colours, no gloss, no inner shadow, no glow.
   Ultra turns the very same controls into glass (the Ultra block below; with WebGL the renderer paints the real refracting glass). */
.ring .fg,.ex-fill{transition:none} /* updated every frame now, so no lagging animation */
input[type=range]{-webkit-appearance:none;appearance:none;background:none;height:22px;--gs:var(--accent,var(--amber))}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:linear-gradient(var(--gs),var(--gs)) 0 0/var(--v,50%) 100% no-repeat,var(--border)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-6px;border-radius:50%;border:0;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
input[type=range]::-moz-range-track{height:6px;border-radius:999px;background:var(--border)}
input[type=range]::-moz-range-progress{height:6px;border-radius:999px;background:var(--gs)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;border:0;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}

/* ===== Ultra: iOS 27 "Clear" Liquid Glass =====
   Rendered by a WebGL2 pass (see the script below) so every surface gets real edge refraction in every browser.
   The CSS in this block is (a) the fallback when WebGL2 is unavailable and (b) the shapes, shadows and press feel. */
[data-glass="ultra"]{--glass-alpha:.14;--glass-alpha2:.1;--glass-border-a:0;--ug-bf:blur(2px) brightness(1.06);
  --glass-sheen:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 1.5px 1px -.5px rgba(255,255,255,.5),inset 0 -1px 1px -.5px rgba(255,255,255,.22),inset 0 0 16px 1px rgba(255,255,255,.07);
  --glass-lift:0 4px 14px -4px rgba(0,0,0,.24);--glass-drop:0 14px 36px -14px rgba(0,0,0,.4);--shadow:var(--glass-drop)}

<script>
/* ---------- storage ---------- */
const DB_KEY='chronly.v1';
const defaultDB={settings:{theme:'system',accent:'amber',hour12:true,vibrate:true,vol:0.6,
    customBg:null,customAccent:null,showSeconds:true,showMillis:false,clockStyle:'digital',faceStyle:'classic',
    bgImage:null,useBgImage:false,glassLevel:'off',glassClarity:3,glassTint:null,glassTintAmt:.45,timerStyle:'ring',notifEnabled:false,font:'default',customFont:null},
  savedTimers:[],alarms:[],pomodoro:{workDur:25,shortDur:5,longDur:15,rounds:4,sessions:0,focusMin:0,goalMin:240,dateStamp:''},
  worldCities:[],timerState:null,pomoState:null,examTimers:[],examState:null};
let DB;
try{DB=JSON.parse(localStorage.getItem(DB_KEY))||structuredClone(defaultDB);}catch(e){DB=structuredClone(defaultDB);}
for(const k in defaultDB){if(!(k in DB))DB[k]=defaultDB[k];}
DB.settings={...defaultDB.settings,...DB.settings}; // backfill any settings keys missing from an older save
function save(){try{localStorage.setItem(DB_KEY,JSON.stringify(DB));return true;}catch(e){console.warn('storage failed',e);return false;}}

/* ---------- fonts ---------- */
var _cf='';
var FONTS={system:'system-ui,-apple-system,"Segoe UI",sans-serif',manrope:"'Manrope',sans-serif",dmsans:"'DM Sans',sans-serif",sora:"'Sora',sans-serif",fraunces:"'Fraunces',serif",georgia:"Georgia,'Times New Roman',serif",mono:"'JetBrains Mono',ui-monospace,monospace"};

function applyFont(){
  const s=DB.settings, st=document.documentElement.style;
  let b="'Inter',system-ui,sans-serif", n="'Space Grotesk',system-ui,sans-serif";
  if(s.font==='custom' && s.customFont){
    if(_cf!==s.customFont.data){ _cf=s.customFont.data;
      const f=new FontFace('ChronlyCustom',`url("${_cf}")`); f.load().then(()=>document.fonts.add(f)).catch(()=>alert('That font file could not be loaded.')); }

function handleFontFile(file){

  const r=new FileReader();
  r.onload=()=>{ DB.settings.customFont={name:file.name.replace(/\.[^.]+$/,''),data:r.result}; DB.settings.font='custom';

}
function fontRows(s){
  const opts=Object.entries(FONT_LABELS).map(([v,l])=>`<option value="${v}" ${s.font===v?'selected':''}>${l}</option>`).join('')+(s.customFont?`<option value="custom" ${s.font==='custom'?'selected':''}>${s.customFont.name.replace(/[<>&"]/g,'')} (uploaded)</option>`:'');
  return `<div class="set-row"><div><div class="lbl">Font</div><div class="desc">Applies to text and numbers everywhere</div></div><select id="setFont">${opts}</select></div>
    <div class="set-row"><div><div class="lbl">Upload your own font</div><div class="desc">.ttf, .otf, .woff or .woff2 — stays on this device</div></div>
      <div style="display:flex;gap:8px;align-items:center"><label class="btn" for="fontFileInput" style="cursor:pointer;margin:0">${s.customFont?'Change':'Choose…'}</label><input type="file" id="fontFileInput" accept=".ttf,.otf,.woff,.woff2,font/*" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden">${s.customFont?'<button class="icon-btn" id="fontRemove" title="Remove font">✕</button>':''}</div></div>`;

/* ---------- theme ---------- */
function hexToHsl(hex){
  let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b); let h,s,l=(max+min)/2;
  if(max===min){h=s=0;} else { const d=max-min; s=l>0.5? d/(2-max-min): d/(max+min);
    switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;default:h=(r-g)/d+4;} h/=6; }
  return [h*360,s*100,l*100];
}
function hslToHex(h,s,l){
  s/=100;l/=100; const k=n=>(n+h/30)%12; const a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const toHex=x=>Math.round(255*x).toString(16).padStart(2,'0');
  return '#'+toHex(f(0))+toHex(f(8))+toHex(f(4));
}
function adjustL(hex,deltaFrac){ const [h,s,l]=hexToHsl(hex); return hslToHex(h,s,Math.max(0,Math.min(100,l+deltaFrac*100))); }
function mixHex(a,b,t){
  const ah=parseInt(a.slice(1),16),bh=parseInt(b.slice(1),16);
  const ar=(ah>>16)&255,ag=(ah>>8)&255,ab=ah&255,br=(bh>>16)&255,bg=(bh>>8)&255,bb=bh&255;
  const mix=(x,y)=>Math.round(x+(y-x)*t);

  if(actx.state==='suspended')actx.resume();

  if(name==='beep'){tone(880,0.15);}
  else if(name==='double'){tone(880,0.12);tone(880,0.12,'sine',0.2);}
  else if(name==='bell'){tone(660,0.6,'triangle');tone(990,0.6,'triangle',0.05,0.5);}

  const p=n=>String(n).padStart(2,'0');
  return (h>0?p(h)+':':'')+p(m)+':'+p(s)+(cent?'.'+p(c):'');
}

/* Analogue "kitchen timer" dial overlay for countdown rings (Timer/Pomodoro/Exam Timer).
   pct = fraction of time remaining (1 = full, 0 = done); the hand sweeps clockwise from 12 as time elapses,
   landing exactly on the leading edge of the countdown arc.
   Note: the containing `.ring svg` already carries a CSS `transform:rotate(-90deg)` (that's what makes the
   plain progress arc start at 12 o'clock) — every angle below is deliberately computed to cancel that out,
   so don't "simplify" these by re-adding a -90deg offset the way analogueFace() (a *different*, untransformed
   SVG) uses. Only used when settings.timerStyle==='analogue'. */
function dialHandAngle(pct){ return (((1-Math.max(0,Math.min(1,pct)))*360)+90).toFixed(1); }
function dialTicks(cx,cy,r){
  let out='';
  for(let i=0;i<12;i++){ const rad=(i*30)*Math.PI/180;
    const outer=r-8, inner= i%3===0? r-18: r-13;
    const x1=cx+outer*Math.cos(rad), y1=cy+outer*Math.sin(rad), x2=cx+inner*Math.cos(rad), y2=cy+inner*Math.sin(rad);
    out+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--muted)" stroke-width="${i%3===0?2:1.2}" opacity="${i%3===0?0.55:0.3}"/>`;
  }
  return out;
}
function dialHand(cx,cy,r,pct){
  return `<g class="hand" transform="rotate(${dialHandAngle(pct)} ${cx} ${cy})">
    <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${(cy-(r-26)).toFixed(1)}" stroke="var(--accent,var(--amber))" stroke-width="3" stroke-linecap="round"/>
  </g><circle cx="${cx}" cy="${cy}" r="4.5" fill="var(--accent,var(--amber))"/>`;
}

let timerRAF=null;
function timerCurrentDuration(){ return (DB._tmpH||0)*3600+(DB._tmpM==null?25:DB._tmpM)*60+(DB._tmpS||0); }
function timerUpdatePreview(){
  if(DB.timerState) return;
  const dur=timerCurrentDuration();
  const lab=document.querySelector('.ring .label .t');
  if(lab) lab.textContent=fmtHMS(dur*1000,false);
}
function timerStart(durSec){
  if(!durSec) durSec=timerCurrentDuration();
  DB.timerState={endTime:Date.now()+durSec*1000, total:durSec, paused:false, remainingAtPause:null,
    sound: DB.timerState?.sound||'chime', autoRestart: DB.timerState?.autoRestart||false, name: DB.timerState?.name||'Timer'};
  save(); renderSection();
}
function timerPause(){
  const t=DB.timerState; if(!t||t.paused)return;
  t.remainingAtPause=t.endTime-Date.now(); t.paused=true; save(); renderSection();
}
function timerResume(){
  const t=DB.timerState; if(!t||!t.paused)return;
  t.endTime=Date.now()+Math.max(0,t.remainingAtPause); t.paused=false; save(); renderSection();
}
function timerReset(){ DB.timerState=null; save(); renderSection(); }
function timerAdjust(sec){
  const t=DB.timerState; if(!t)return;
  if(t.paused){ t.remainingAtPause+=sec*1000; } else { t.endTime+=sec*1000; }
  t.total+=sec; save();
}
function timerRemaining(){
  const t=DB.timerState; if(!t) return 0;
  return t.paused? t.remainingAtPause : t.endTime-Date.now();
}

  document.querySelectorAll('[data-dup]').forEach(b=>b.onclick=()=>{const s=DB.savedTimers.find(x=>x.id===b.dataset.dup); DB.savedTimers.push({...s,id:crypto.randomUUID(),name:s.name+' copy'}); save(); renderSection();});
  document.querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>{const s=DB.savedTimers.find(x=>x.id===b.dataset.ren);
    openModal(`<h3>Rename</h3><input id="mName" value="${s.name}" class="fld" style="width:100%;padding:10px;border-radius:8px">

function timerTick(){
  const t=DB.timerState;

function renderTimerTick(){

/* =================== STOPWATCH =================== */
function swState(){ DB._sw = DB._sw||{running:false,startAt:0,elapsedBefore:0,laps:[]}; return DB._sw; }
function swElapsed(){ const s=swState(); return s.elapsedBefore + (s.running? Date.now()-s.startAt : 0); }
function renderStopwatch(){
  const s=swState();
  const laps=s.laps;
  let lapHtml = laps.length? diffLaps(laps).map((sp,i)=>`<div class="statline"><span>Lap ${i+1}</span><span><b class="num">${fmtHMS(sp,true)}</b><span class="num" style="opacity:.55;margin-left:10px">${fmtHMS(laps[i],true)}</span></span></div>`).reverse().join('') : `<div class="empty"><b>No laps yet.</b>Laps will appear here.</div>`;
  let fastest=laps.length?Math.min(...diffLaps(laps)):null, slowest=laps.length?Math.max(...diffLaps(laps)):null, avg=laps.length?diffLaps(laps).reduce((a,b)=>a+b,0)/laps.length:null;
  document.getElementById('main').innerHTML=`
  <h1 class="title">Stopwatch</h1><p class="sub">Precise to the centisecond.</p>
  <div class="card"><div class="ring-wrap">
    <div class="t num" style="font-size:46px" id="swDisplay">${fmtHMS(swElapsed(),true)}</div>
    <div class="ctrl-row">
      ${!s.running && s.elapsedBefore===0? `<button class="btn primary" id="swStart">Start</button>`:''}
      ${s.running? `<button class="btn" id="swLap">Lap</button><button class="btn primary" id="swPause">Pause</button>`:''}
      ${!s.running && s.elapsedBefore>0? `<button class="btn primary" id="swResume">Resume</button><button class="btn danger" id="swReset">Reset</button>`:''}
    </div>
  </div></div>
  ${laps.length? `<div class="grid cols3" style="margin-top:16px">
    <div class="card"><div class="sub" style="margin:0">Fastest</div><div class="t num" style="font-size:18px">${fmtHMS(fastest,true)}</div></div>
    <div class="card"><div class="sub" style="margin:0">Slowest</div><div class="t num" style="font-size:18px">${fmtHMS(slowest,true)}</div></div>
    <div class="card"><div class="sub" style="margin:0">Average</div><div class="t num" style="font-size:18px">${fmtHMS(avg,true)}</div></div>
  </div>`:''}
  <h1 class="title subhead">Laps ${laps.length?`<button class="btn" style="float:right;font-size:12px;padding:6px 12px" id="swExport">Copy laps</button>`:''}</h1>
  <div class="card" style="margin-top:10px">${lapHtml}</div>`;
  const b=id=>document.getElementById(id);
  if(b('swStart'))b('swStart').onclick=()=>{s.running=true;s.startAt=Date.now();save();renderSection();};
  if(b('swPause'))b('swPause').onclick=()=>{s.elapsedBefore+=Date.now()-s.startAt;s.running=false;save();renderSection();};
  if(b('swResume'))b('swResume').onclick=()=>{s.running=true;s.startAt=Date.now();save();renderSection();};
  if(b('swReset'))b('swReset').onclick=()=>{DB._sw={running:false,startAt:0,elapsedBefore:0,laps:[]};save();renderSection();};
  if(b('swLap'))b('swLap').onclick=()=>{s.laps.push(swElapsed());save();renderSection();};
  if(b('swExport'))b('swExport').onclick=()=>{ navigator.clipboard?.writeText(laps.map((l,i)=>`Lap ${i+1}: ${fmtHMS(diffLaps(laps)[i],true)} (total ${fmtHMS(l,true)})`).join('\n')); };
}
function diffLaps(laps){ const out=[]; for(let i=0;i<laps.length;i++) out.push(i===0?laps[0]:laps[i]-laps[i-1]); return out; }
function swTick(){ if(current==='stopwatch') setT(document.getElementById('swDisplay'),fmtHMS(swElapsed(),true)); }

/* =================== POMODORO =================== */
function pomoToday(){
  const today=new Date().toDateString();
  if(DB.pomodoro.dateStamp!==today){ DB.pomodoro.dateStamp=today; DB.pomodoro.sessions=0; DB.pomodoro.focusMin=0; save(); }
  return DB.pomodoro;
}
function pomoStart(phase){
  const p=DB.pomodoro;
  let durMin = phase==='work'? p.workDur : phase==='short'? p.shortDur : p.longDur;
  DB.pomoState={phase, endTime:Date.now()+durMin*60000, total:durMin*60, paused:false, round: DB.pomoState?.round||1};
  save(); renderSection();
}
function pomoPause(){ const ps=DB.pomoState; if(!ps||ps.paused)return; ps._pausedRem=ps.endTime-Date.now(); ps.paused=true; save(); renderSection(); }
function pomoResume(){ const ps=DB.pomoState; if(!ps||!ps.paused)return; ps.endTime=Date.now()+ps._pausedRem; ps.paused=false; save(); renderSection(); }
function pomoComplete(){
  const p=DB.pomodoro, ps=DB.pomoState;
  const base=(!ps.paused && Date.now()>=ps.endTime && Date.now()-ps.endTime<5000)?ps.endTime:Date.now();
  if(ps.phase==='work'){ p.sessions++; p.focusMin+=Math.round(ps.total/60); pomoToday(); }
  playSound('chime'); vibrate([150,80,150]); notify('Pomodoro', ps.phase==='work'?'Work session complete — take a break.':'Break over — back to work.');
  if(ps.phase==='work'){
    const isLong = ps.round % p.rounds === 0;
    DB.pomoState={phase:isLong?'long':'short', endTime:base+(isLong?p.longDur:p.shortDur)*60000, total:(isLong?p.longDur:p.shortDur)*60, paused:false, round:ps.round};
  } else {
    const nextRound = ps.phase==='long'? 1 : ps.round+1;
    DB.pomoState={phase:'work', endTime:base+p.workDur*60000, total:p.workDur*60, paused:false, round:nextRound};
  }
  save(); renderSection();
}
function renderPomodoro(){
  const p=pomoToday(); const ps=DB.pomoState;
  const rem = ps? (ps.paused? ps._pausedRem : ps.endTime-Date.now()) : (p.workDur*60*1000);
  const dur = ps? ps.total : p.workDur*60;
  const pct = Math.max(0,Math.min(1, rem/1000/dur));
  const R=126,C=2*Math.PI*R, off=C*(1-pct);
  const phaseLabel = ps? ({work:'FOCUS',short:'SHORT BREAK',long:'LONG BREAK'})[ps.phase] : 'FOCUS';
  const dots=Array.from({length:p.rounds},(_,i)=> i < ((ps?.round||1)-1)%p.rounds ? 'done':'').map(c=>`<span class="${c}"></span>`).join('');
  document.getElementById('main').innerHTML=`
  <h1 class="title">Pomodoro</h1><p class="sub">Work session ${ps?ps.round:1} of ${p.rounds}</p>
  <div class="card"><div class="ring-wrap">
    <div class="ring"><svg viewBox="0 0 280 280"><circle class="bg" cx="140" cy="140" r="${R}"/>
    ${DB.settings.timerStyle==='analogue'? dialTicks(140,140,R):''}
    <circle class="fg" cx="140" cy="140" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${off}"/>
    ${DB.settings.timerStyle==='analogue'? dialHand(140,140,R,pct):''}</svg>
    <div class="label"><div class="t num" id="poDisplay">${fmtCD(rem,DB.settings.showMillis)}</div><div class="s">${phaseLabel}</div></div></div>
    <div class="dots">${dots}</div>
    <div class="ctrl-row">
      ${!ps? `<button class="btn primary" id="poStart">Start</button>`:
        ps.paused? `<button class="btn primary" id="poResume">Resume</button><button class="btn danger" id="poReset">Reset</button>`:
        `<button class="btn" id="poSkip">Skip</button><button class="btn primary" id="poPause">Pause</button><button class="btn danger" id="poReset">Reset</button>`}
    </div>
  </div></div>
  <h1 class="title subhead">Today</h1>
  <div class="card" style="margin-top:10px">
    <div class="statline"><span>Sessions completed</span><b>${p.sessions}</b></div>
    <div class="statline"><span>Total focus time</span><b>${Math.floor(p.focusMin/60)}h ${p.focusMin%60}m</b></div>
    <div class="statline"><span>Daily goal</span><b>${Math.floor(p.focusMin/60)}h ${p.focusMin%60}m / ${Math.floor(p.goalMin/60)}h</b></div>
    <div class="progress-bar"><div style="width:${Math.min(100,p.focusMin/p.goalMin*100)}%"></div></div>
  </div>
  <h1 class="title subhead">Preset</h1>
  <div class="chips">
    <button class="chip" data-po="25,5,15,4">Classic 25/5</button>
    <button class="chip" data-po="50,10,10,2">50/10</button>
    <button class="chip" data-po="90,20,20,2">90/20</button>
    <button class="chip" data-po="52,17,17,2">52/17</button>
  </div>`;
  const b=id=>document.getElementById(id);
  if(b('poStart'))b('poStart').onclick=()=>pomoStart('work');
  if(b('poPause'))b('poPause').onclick=pomoPause;
  if(b('poResume'))b('poResume').onclick=pomoResume;
  if(b('poReset'))b('poReset').onclick=()=>{DB.pomoState=null;save();renderSection();};
  if(b('poSkip'))b('poSkip').onclick=pomoComplete;
  document.querySelectorAll('[data-po]').forEach(x=>x.onclick=()=>{
    const [w,s,l,r]=x.dataset.po.split(',').map(Number); p.workDur=w;p.shortDur=s;p.longDur=l;p.rounds=r; DB.pomoState=null; save(); renderSection();
  });
}
function pomoTick(){
  const ps=DB.pomoState;
  if(ps && !ps.paused){
    const rem=ps.endTime-Date.now();
    if(rem<=0 && !ps._fired){ ps._fired=true; save(); pomoComplete(); }
  }
  if(current==='pomodoro'){ const el=document.getElementById('poDisplay'); const ps2=DB.pomoState;
    if(el && ps2 && !ps2.paused){ setT(el,fmtCD(ps2.endTime-Date.now(),DB.settings.showMillis)); }
    if(ps2 && !ps2.paused){
      const pct=Math.max(0,Math.min(1,(ps2.endTime-Date.now())/1000/ps2.total)); const C=2*Math.PI*126;
      const fg=document.querySelector('#main .ring .fg'); if(fg) setA(fg,'stroke-dashoffset', C*(1-pct));
      const hand=document.querySelector('#main .ring .hand'); if(hand) setA(hand,'transform', `rotate(${dialHandAngle(pct)} 140 140)`);
    }

}

/* =================== WORLD CLOCK =================== */
const TIMEZONES = (Intl.supportedValuesOf ? Intl.supportedValuesOf('timeZone') : [
 'Australia/Melbourne','Australia/Sydney','Australia/Brisbane','Australia/Perth','Australia/Adelaide','Pacific/Auckland',
 'Asia/Tokyo','Asia/Seoul','Asia/Singapore','Asia/Shanghai','Asia/Hong_Kong','Asia/Bangkok','Asia/Dubai',
 'Europe/London','Europe/Paris','Europe/Berlin','Europe/Rome','America/New_York','America/Los_Angeles','America/Chicago',
 'America/Toronto','America/Vancouver','America/Sao_Paulo','America/Mexico_City','Pacific/Honolulu']);
function cityLabel(tz){ const parts=tz.split('/'); return parts[parts.length-1].replace(/_/g,' '); }
function regionLabel(tz){ return tz.split('/')[0].replace(/_/g,' '); }
function renderWorldClock(){
  const now=new Date();
  const localOffset = -now.getTimezoneOffset();
  let cards = DB.worldCities.map((tz,idx)=>{
    const hourFmt=new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',hour12:DB.settings.hour12,timeZone:tz});
    const dateFmt=new Intl.DateTimeFormat('en-US',{weekday:'short',day:'numeric',month:'short',timeZone:tz});
    const hourNum = +new Intl.DateTimeFormat('en-US',{hour:'numeric',hour12:false,timeZone:tz}).format(now);
    const isNight = hourNum<6 || hourNum>=19;
    // offset diff
    const tzOffsetMin = getTZOffsetMinutes(tz, now);
    const diff = (tzOffsetMin - localOffset);
    const diffStr = diff===0? 'Same as you' : (diff>0? `+${(diff/60).toFixed(diff%60?1:0)}h ahead` : `${(diff/60).toFixed(diff%60?1:0)}h behind`);
    return `<div class="wc-card ${isNight?'night':'day'}">
      <div style="display:flex;justify-content:space-between"><div><div class="city">${cityLabel(tz)}</div><div class="ctry">${regionLabel(tz)}</div></div>
      <button class="icon-btn" data-rmcity="${idx}">✕</button></div>
      ${DB.settings.clockStyle==='analogue'? `<div style="width:76px;margin-top:8px">${analogueFace(now,tz,76)}</div>` : `<div class="time num">${fmtClock(now,tz)}</div>`}
      <div class="meta">${dateFmt.format(now)} · ${diffStr} · ${isNight?'🌙 Night':'☀ Day'}</div></div>`;
  }).join('');
  if(!DB.worldCities.length) cards=`<div class="empty"><b>Add a city to your world clock.</b>Search any city or IANA timezone below.</div>`;
  document.getElementById('main').innerHTML=`
  <h1 class="title">World Clock</h1><p class="sub">Live times using your device's timezone database.</p>
  <div class="search-wrap"><input id="wcSearch" placeholder="Search a city, e.g. Tokyo"><div class="results" id="wcResults" style="display:none"></div></div>
  <div class="grid cols3" style="margin-top:18px">${cards}</div>`;
  const inp=document.getElementById('wcSearch'), res=document.getElementById('wcResults');
  inp.oninput=()=>{
    const q=inp.value.trim().toLowerCase();
    if(!q){res.style.display='none';return;}
    const matches=TIMEZONES.filter(tz=>tz.toLowerCase().includes(q.replace(/\s/g,'_'))||cityLabel(tz).toLowerCase().includes(q)).slice(0,8);
    res.innerHTML= matches.length? matches.map(tz=>`<button data-add="${tz}">${cityLabel(tz)} — ${regionLabel(tz)}</button>`).join('') : `<button disabled style="color:var(--muted)">No matches</button>`;
    res.style.display='block';
    res.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ if(!DB.worldCities.includes(b.dataset.add)){DB.worldCities.push(b.dataset.add);save();} inp.value='';res.style.display='none';renderSection(); });
  };
  document.querySelectorAll('[data-rmcity]').forEach(b=>b.onclick=()=>{ DB.worldCities.splice(+b.dataset.rmcity,1); save(); renderSection(); });
}
function getTZOffsetMinutes(tz, date){
  const dtf=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const parts=Object.fromEntries(dtf.formatToParts(date).map(p=>[p.type,p.value]));
  const asUTC=Date.UTC(+parts.year,+parts.month-1,+parts.day,+parts.hour,+parts.minute,+parts.second);
  return Math.round((asUTC-date.getTime())/60000);
}

function alarmEditor(){
  openModal(`<h3>New alarm</h3>
  <input type="time" id="aTime" value="07:00" class="fld" style="width:100%;padding:10px;border-radius:8px;margin-bottom:10px">

  const sel=new Set();
  document.querySelectorAll('#aDays span').forEach(s=>s.onclick=()=>{ const d=+s.dataset.d; sel.has(d)?sel.delete(d):sel.add(d); s.classList.toggle('on'); });
  document.getElementById('mCancel').onclick=closeModal;
  document.getElementById('mOk').onclick=()=>{
    DB.alarms.push({id:crypto.randomUUID(), time:document.getElementById('aTime').value, label:document.getElementById('aLabel').value,
      days:[...sel], enabled:true, sound:'alarm', snoozeMin:10});

var lastAlarmTs=Math.floor(Date.now()/60000)*60000-1, SNZ=[];
function alarmTick(){
  const now=Date.now(); let fired=false;
  for(let m=Math.floor(Math.max(lastAlarmTs,now-900000)/60000)+1; m*60000<=now; m++){ /* every whole minute crossed since the last tick */
    const d=new Date(m*60000);
    DB.alarms.forEach(a=>{
      if(!a.enabled) return;
      const [h,mi]=a.time.split(':').map(Number);
      if(h===d.getHours() && mi===d.getMinutes() && (a.days.length===0 || a.days.includes(d.getDay()))){
        if(a.days.length===0) a.enabled=false; // one-off alarm: don't repeat tomorrow
        fired=true; triggerAlarm(a);
      }
    });
  }
  lastAlarmTs=now;
  SNZ=SNZ.filter(s=>{ if(now<s.at) return true; triggerAlarm(s.a); return false; });
  if(fired){ save(); if(current==='alarms') renderSection(); }
}
let activeAlarm=null;
function triggerAlarm(a){
  const ov=document.getElementById('alarmOverlay');
  if(ov._iv) clearInterval(ov._iv);
  activeAlarm=a;
  document.getElementById('alarmLabel').textContent=a.label||'Alarm';
  document.getElementById('alarmTime').textContent=a.time;
  ov.classList.add('show');
  vibrate([400,200,400,200,400]);
  const iv=setInterval(()=>{ if(!activeAlarm){clearInterval(iv);return;} playSound(a.sound||'alarm'); },1200);
  ov._iv=iv;
  notify('Alarm', a.label||'Alarm');
}
document.getElementById('alarmDismiss').onclick=()=>{ clearInterval(document.getElementById('alarmOverlay')._iv); document.getElementById('alarmOverlay').classList.remove('show'); activeAlarm=null; };
document.getElementById('alarmSnooze').onclick=()=>{
  clearInterval(document.getElementById('alarmOverlay')._iv); document.getElementById('alarmOverlay').classList.remove('show');
  const a=activeAlarm; activeAlarm=null;
  if(a) SNZ.push({a,at:Date.now()+(a.snoozeMin||10)*60000});
};

/* =================== EXAM TIMER =================== */
const STAGE_COLORS=['#e8a33d','#4fd1c5','#a78bfa','#5fd08a','#e5605a','#60a5fa','#f472b6','#facc15'];
function examDraftDefault(){
  return DB._examDraft || (DB._examDraft=[{name:'Reading',minutes:10,color:STAGE_COLORS[0]},{name:'Writing',minutes:40,color:STAGE_COLORS[1]}]);
}
function examStart(stages,name){
  const list=stages.map(s=>({name:s.name||'Stage',seconds:Math.max(1,Math.round(s.minutes*60)),color:s.color||STAGE_COLORS[0]}));
  DB.examState={stages:list, idx:0, endTime:Date.now()+list[0].seconds*1000, paused:false, remainingAtPause:null, finished:false, name:name||'Exam'};
  save(); renderSection();
}
function examRemaining(){ const e=DB.examState; if(!e) return 0; return e.paused? e.remainingAtPause : e.endTime-Date.now(); }
function examPause(){ const e=DB.examState; if(!e||e.paused) return; e.remainingAtPause=e.endTime-Date.now(); e.paused=true; save(); renderSection(); }
function examResume(){ const e=DB.examState; if(!e||!e.paused) return; e.endTime=Date.now()+Math.max(0,e.remainingAtPause); e.paused=false; save(); renderSection(); }
function examReset(){ DB.examState=null; save(); renderSection(); }
function examAdvance(){
  const e=DB.examState; if(!e) return;
  const hasNext = e.idx+1<e.stages.length;
  playSound('chime'); vibrate([150,80,150]); notify('Exam timer', hasNext? e.stages[e.idx+1].name+' starting' : 'All stages complete');
  if(hasNext){ const base=(!e.paused && Date.now()>=e.endTime)?e.endTime:Date.now(); e.idx++; e.endTime=base+e.stages[e.idx].seconds*1000; e.paused=false; e._fired=false; }
  else { e.finished=true; }
  save(); renderSection();
}
function examTick(){
  const e=DB.examState;
  if(e && !e.paused && !e.finished){
    const rem=e.endTime-Date.now();
    if(rem<=0 && !e._fired){ e._fired=true; save(); examAdvance(); }
  }
  if(current==='examtimer') renderExamTick();
}
function renderExamTick(){
  const e=DB.examState; if(!e||e.finished||e.paused) return;
  const stage=e.stages[e.idx]; const rem=examRemaining();
  const pct=Math.max(0,Math.min(1,rem/1000/stage.seconds));
  const C=2*Math.PI*126;
  const fg=document.querySelector('#main .ring .fg'); if(fg) setA(fg,'stroke-dashoffset', C*(1-pct));
  const hand=document.querySelector('#main .ring .hand'); if(hand) setA(hand,'transform', `rotate(${dialHandAngle(pct)} 140 140)`);
  const lab=document.querySelector('#main .ring .label .t'); setT(lab,fmtCD(rem,DB.settings.showMillis));
  const fill=document.querySelector('#main .ex-seg.cur .ex-fill');
  if(fill){ const w=(Math.max(0,rem)/1000/stage.seconds*100).toFixed(2)+'%'; if(fill.style.width!==w) fill.style.width=w; }
}
function renderExamTimer(){
  const e=DB.examState;
  const drafts=examDraftDefault();
  let body;
  if(!e){
    const rows=drafts.map((st,i)=>`<div class="saved-card" style="margin-bottom:8px;border-left:4px solid ${st.color}">
      <div style="display:flex;gap:8px;align-items:center;flex:1;flex-wrap:wrap">
        <input type="color" data-stcolor="${i}" value="${st.color}">
        <input data-stname="${i}" value="${st.name}" placeholder="Stage name" class="fld" style="flex:1;min-width:100px;padding:8px;border-radius:8px">
        <input type="number" min="1" data-stmin="${i}" value="${st.minutes}" class="fld" style="width:60px;padding:8px;border-radius:8px;text-align:center">
        <span style="color:var(--muted);font-size:12px">min</span>
      </div>
      <button class="icon-btn" data-strm="${i}" title="Remove stage">✕</button></div>`).join('');
    let saved=DB.examTimers.map(t=>`<div class="saved-card"><div><div class="name">${t.name}</div><div class="dur">${t.stages.length} stages · ${t.stages.reduce((a,s)=>a+s.minutes,0)}m total</div></div>
      <div style="display:flex;gap:4px"><button class="icon-btn" data-examuse="${t.id}" title="Start">▶</button><button class="icon-btn" data-examdel="${t.id}" title="Delete">✕</button></div></div>`).join('');
    if(!DB.examTimers.length) saved=`<div class="empty"><b>No saved routines yet.</b>Build stages below and save them for reuse.</div>`;
    body=`<div class="card"><div id="examRows">${rows}</div>
      <button class="btn" id="examAddStage" style="width:100%;margin-top:8px">+ Add stage</button>
      <div class="ctrl-row"><button class="btn primary" id="examStart">Start exam</button><button class="btn" id="examSaveTpl">Save as routine</button></div>
    </div>
    <h1 class="title subhead">Saved routines</h1>
    <div class="grid" style="margin-top:10px">${saved}</div>`;
  } else if(e.finished){
    body=`<div class="card"><div class="ring-wrap">
      <div class="t num" style="font-size:30px;text-align:center">All stages complete</div>
      <div class="s" style="color:var(--muted);margin-top:6px">${e.name}</div>
      <div class="ctrl-row"><button class="btn primary" id="examDone">Done</button></div>
    </div></div>`;
  } else {
    const stage=e.stages[e.idx]; const rem=examRemaining();
    const pct=Math.max(0,Math.min(1,rem/1000/stage.seconds));
    const R=126,C=2*Math.PI*R, off=C*(1-pct);
    const timeline=e.stages.map((s,i)=>{
      const st=i<e.idx?'done':i===e.idx?'cur':'next', w=st==='done'?0:st==='cur'?pct*100:100;
      return `<div class="ex-seg ${st}" title="${s.name}" style="flex:${s.seconds};--seg:${s.color}"><div class="ex-fill" style="width:${w.toFixed(2)}%"></div></div>`;
    }).join('');
    body=`<div class="card" style="--accent:${stage.color}"><div class="ring-wrap">
      <div class="ring"><svg viewBox="0 0 280 280"><circle class="bg" cx="140" cy="140" r="${R}"/>
      ${DB.settings.timerStyle==='analogue'? dialTicks(140,140,R):''}
      <circle class="fg" cx="140" cy="140" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${off}"/>
      ${DB.settings.timerStyle==='analogue'? dialHand(140,140,R,pct):''}</svg>
      <div class="label"><div class="t num">${fmtCD(rem,DB.settings.showMillis)}</div>
      <div class="s" style="text-transform:uppercase;letter-spacing:.05em;color:${stage.color};font-weight:600">${stage.name}</div></div></div>
      <div class="s" style="margin-top:10px;color:var(--muted)">Stage ${e.idx+1} of ${e.stages.length} · ${e.name}</div>
      <div class="ex-timeline">${timeline}</div>
      <div class="ctrl-row">
        ${e.paused? `<button class="btn primary" id="examResume">Resume</button>`:`<button class="btn primary" id="examPause">Pause</button>`}
        <button class="btn" id="examSkip">Skip stage</button>
        <button class="btn danger" id="examReset">End</button>
      </div>
    </div></div>`;
  }
  document.getElementById('main').innerHTML=`<h1 class="title">Exam Timer</h1><p class="sub">Chain reading, writing and other timed stages back to back — add as many as you need.</p>${body}`;
  if(!e){
    document.querySelectorAll('[data-stname]').forEach(inp=>inp.oninput=ev=>{drafts[+inp.dataset.stname].name=ev.target.value;});
    document.querySelectorAll('[data-stmin]').forEach(inp=>inp.oninput=ev=>{drafts[+inp.dataset.stmin].minutes=Math.max(1,+ev.target.value||1);});
    document.querySelectorAll('[data-stcolor]').forEach(inp=>inp.oninput=ev=>{drafts[+inp.dataset.stcolor].color=ev.target.value; inp.closest('.saved-card').style.borderLeftColor=ev.target.value;});
    document.querySelectorAll('[data-strm]').forEach(b=>b.onclick=()=>{ drafts.splice(+b.dataset.strm,1); if(!drafts.length) drafts.push({name:'Stage',minutes:10,color:STAGE_COLORS[0]}); renderSection(); });
    document.getElementById('examAddStage').onclick=()=>{ drafts.push({name:'Stage '+(drafts.length+1),minutes:10,color:STAGE_COLORS[drafts.length%STAGE_COLORS.length]}); renderSection(); };
    document.getElementById('examStart').onclick=()=>examStart(drafts,'Exam');
    document.getElementById('examSaveTpl').onclick=()=>{
      openModal(`<h3>Save routine</h3><p>Give this stage sequence a name.</p><input id="mName" placeholder="e.g. Final Exam" class="fld" style="width:100%;padding:10px;border-radius:8px">
      <div class="row" style="margin-top:16px"><button class="btn" id="mCancel">Cancel</button><button class="btn primary" id="mOk">Save</button></div>`);
      document.getElementById('mCancel').onclick=closeModal;
      document.getElementById('mOk').onclick=()=>{
        const name=document.getElementById('mName').value.trim()||'Routine';
        DB.examTimers.push({id:crypto.randomUUID(),name,stages:JSON.parse(JSON.stringify(drafts))}); save(); closeModal(); renderSection();
      };
    };
    document.querySelectorAll('[data-examuse]').forEach(b=>b.onclick=()=>{ const t=DB.examTimers.find(x=>x.id===b.dataset.examuse); if(t) examStart(t.stages,t.name); });
    document.querySelectorAll('[data-examdel]').forEach(b=>b.onclick=()=>confirmModal('Delete routine','This saved exam routine will be removed.',()=>{ DB.examTimers=DB.examTimers.filter(x=>x.id!==b.dataset.examdel); save(); renderSection(); }));
  } else if(e.finished){
    document.getElementById('examDone').onclick=examReset;
  } else {
    const pb=document.getElementById('examPause'); if(pb) pb.onclick=examPause;
    const rb=document.getElementById('examResume'); if(rb) rb.onclick=examResume;
    document.getElementById('examSkip').onclick=examAdvance;
    document.getElementById('examReset').onclick=()=>confirmModal('End exam','This will stop the current exam session.',examReset);
  }
}

  <div class="card" style="margin-top:10px">
    <div class="set-row"><div><div class="lbl">Clock format</div></div>
      <select id="setHour12"><option value="1" ${s.hour12?'selected':''}>12-hour</option><option value="0" ${!s.hour12?'selected':''}>24-hour</option></select></div>
    <div class="set-row"><div><div class="lbl">Clock face</div><div class="desc">Home and World Clock display</div></div>
      <select id="setClockStyle"><option value="digital" ${s.clockStyle==='digital'?'selected':''}>Digital</option><option value="analogue" ${s.clockStyle==='analogue'?'selected':''}>Analogue</option></select></div>
    ${s.clockStyle==='analogue'? `<div class="set-row"><div><div class="lbl">Watch face style</div></div>
      <select id="setFaceStyle">${[['classic','Classic'],['minimal','Minimal'],['modern','Modern'],['numerals','Numerals'],['roman','Roman']].map(([v,l])=>`<option value="${v}" ${s.faceStyle===v?'selected':''}>${l}</option>`).join('')}</select></div>`:''}
    <div class="set-row"><div><div class="lbl">Timer display</div><div class="desc">Countdown style for Timer, Pomodoro and Exam Timer</div></div>
      <select id="setTimerStyle"><option value="ring" ${s.timerStyle==='ring'?'selected':''}>Ring</option><option value="analogue" ${s.timerStyle==='analogue'?'selected':''}>Analogue dial</option></select></div>
    <div class="set-row"><div><div class="lbl">Show seconds</div><div class="desc">On the Home and World Clock displays</div></div>
      <label class="switch"><input type="checkbox" id="setSeconds" ${s.showSeconds?'checked':''}><div class="track"></div><div class="knob"></div></label></div>
    <div class="set-row"><div><div class="lbl">Show milliseconds</div><div class="desc">Hundredths of a second on Timer, Pomodoro and Exam Timer countdowns</div></div>
      <label class="switch"><input type="checkbox" id="setMillis" ${s.showMillis?'checked':''}><div class="track"></div><div class="knob"></div></label></div>
  </div>

  <h1 class="title subhead">Sound &amp; notifications</h1>
  <div class="card" style="margin-top:10px">
    <div class="set-row"><div><div class="lbl">Vibration</div><div class="desc">Vibrate on supported devices for timers and alarms</div></div>
      <label class="switch"><input type="checkbox" id="setVibrate" ${s.vibrate?'checked':''}><div class="track"></div><div class="knob"></div></label></div>
    <div class="set-row"><div><div class="lbl">Volume</div></div><input type="range" id="setVol" min="0" max="1" step="0.05" value="${s.vol}" style="--v:${s.vol*100}%"></div>
    <div class="set-row"><div><div class="lbl">Notifications</div><div class="desc">${!notifSupported?"Not supported in this browser": notifPerm==='denied'?"Blocked — allow notifications for this site in your browser settings": notifPerm==='granted'?"You'll be notified when a timer or alarm finishes in a background tab":"Get notified when a timer or alarm finishes in a background tab"}</div></div>
      <button class="btn" id="notifBtn" ${!notifSupported||notifPerm!=='default'?'disabled':''}>${!notifSupported?'Unavailable': notifPerm==='granted'?'Enabled ✓': notifPerm==='denied'?'Blocked':'Enable'}</button></div>
  </div>

  <h1 class="title subhead">Shortcuts</h1>
  <div class="card" style="margin-top:10px;font-size:13px;color:var(--muted);line-height:1.9">
    <div><b style="color:var(--text)">Space</b> — Start / Pause &nbsp; <b style="color:var(--text)">R</b> — Reset &nbsp; <b style="color:var(--text)">L</b> — Lap &nbsp; <b style="color:var(--text)">Esc</b> — Close overlay</div>
  </div>
  <h1 class="title subhead">Data</h1>
  <div class="card" style="margin-top:10px">
    <div class="set-row"><div class="lbl">Export data</div><button class="btn" id="expBtn">Export JSON</button></div>
    <div class="set-row"><div class="lbl">Import data</div><div><label class="btn" for="impFile" style="cursor:pointer;margin:0">Choose file…</label><input type="file" id="impFile" accept="application/json" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden"></div></div>
    <div class="set-row"><div class="lbl">Reset all data</div><button class="btn danger" id="resetBtn">Reset</button></div>
  </div>`;
  document.getElementById('setTheme').onchange=e=>{s.theme=e.target.value;save();applyTheme();};
  document.querySelectorAll('.swatch[data-accent]').forEach(sw=>sw.onclick=()=>{s.accent=sw.dataset.accent;s.customAccent=null;save();applyTheme();renderSection();});
  document.getElementById('setAccentColor').oninput=e=>{s.customAccent=e.target.value;save();applyTheme();};
  document.getElementById('setAccentReset').onclick=()=>{s.customAccent=null;save();applyTheme();renderSection();};
  document.getElementById('setBgColor').oninput=e=>{s.customBg=e.target.value;save();applyTheme();};
  document.getElementById('setBgReset').onclick=()=>{s.customBg=null;save();applyTheme();renderSection();};
  document.getElementById('bgImageInput').onchange=e=>handleBgImageFile(e.target.files[0]);
  const bgRm=document.getElementById('bgImageRemove'); if(bgRm) bgRm.onclick=()=>{s.bgImage=null;s.useBgImage=false;save();applyBackground();renderSection();};
  const useBg=document.getElementById('setUseBg'); if(useBg) useBg.onchange=e=>{s.useBgImage=e.target.checked;save();applyBackground();};
  const syncGlassOpt=()=>{const ult=s.glassLevel==='ultra';document.querySelectorAll('.glass-opt').forEach(r=>r.classList.toggle('off',!ult));
    document.getElementById('setClarity').disabled=!ult;document.getElementById('setTintAmt').disabled=!(ult&&s.glassTint);};
  const markTint=()=>{document.querySelectorAll('.swatch[data-tint]').forEach(x=>x.classList.toggle('sel',(x.dataset.tint||null)===(s.glassTint||null)));
    document.getElementById('setTintColor').classList.toggle('sel',!!s.glassTint&&!TINTS.includes(s.glassTint));};
  let svT=0;const saveSoon=()=>{clearTimeout(svT);svT=setTimeout(save,200);};      // sliders and pickers fire often; write to storage once they settle
  document.getElementById('setGlass').onchange=e=>{s.glassLevel=e.target.value;save();applyBackground();syncGlassOpt();};
  document.getElementById('setClarity').oninput=e=>{s.glassClarity=+e.target.value;e.target.style.setProperty('--v',s.glassClarity/3*100+'%');
    document.querySelectorAll('.clar-ticks span').forEach((x,i)=>x.classList.toggle('on',i===s.glassClarity));saveSoon();applyGlassOpts();};
  document.querySelectorAll('.swatch[data-tint]').forEach(sw=>sw.onclick=()=>{s.glassTint=sw.dataset.tint||null;markTint();syncGlassOpt();save();applyGlassOpts();});
  document.getElementById('setTintColor').oninput=e=>{s.glassTint=e.target.value;markTint();syncGlassOpt();saveSoon();applyGlassOpts();};
  document.getElementById('setTintAmt').oninput=e=>{s.glassTintAmt=e.target.value/100;e.target.style.setProperty('--v',e.target.value+'%');saveSoon();applyGlassOpts();};
  document.getElementById('setFont').onchange=e=>{s.font=e.target.value;save();applyFont();};
  document.getElementById('fontFileInput').onchange=e=>handleFontFile(e.target.files[0]);
  const fRm=document.getElementById('fontRemove'); if(fRm) fRm.onclick=()=>{s.customFont=null;if(s.font==='custom')s.font='default';save();applyFont();renderSection();};
  document.getElementById('setHour12').onchange=e=>{s.hour12=e.target.value==='1';save();};
  document.getElementById('setClockStyle').onchange=e=>{s.clockStyle=e.target.value;save();renderSection();};
  const fsSel=document.getElementById('setFaceStyle'); if(fsSel) fsSel.onchange=e=>{s.faceStyle=e.target.value;save();renderSection();};
  document.getElementById('setTimerStyle').onchange=e=>{s.timerStyle=e.target.value;save();renderSection();};
  document.getElementById('setSeconds').onchange=e=>{s.showSeconds=e.target.checked;save();};
  document.getElementById('setMillis').onchange=e=>{s.showMillis=e.target.checked;save();};
  document.getElementById('setVibrate').onchange=e=>{s.vibrate=e.target.checked;save();};
  document.getElementById('setVol').oninput=e=>{s.vol=+e.target.value;e.target.style.setProperty('--v',s.vol*100+'%');save();};
  const notifBtn=document.getElementById('notifBtn');
  if(notifBtn && !notifBtn.disabled) notifBtn.onclick=()=>{ Notification.requestPermission().then(()=>{ s.notifEnabled = Notification.permission==='granted'; save(); renderSection(); }); };
  document.getElementById('expBtn').onclick=()=>{
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='chronly-data.json'; a.click();
  };
  document.getElementById('impFile').onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader(); r.onload=()=>{ try{ const data=JSON.parse(r.result); if(data && typeof data==='object'){
        const merged=structuredClone(defaultDB);
        for(const k in data){ merged[k] = (k==='settings' && data.settings) ? {...defaultDB.settings, ...data.settings} : data[k]; }
        DB=merged; if(!save()) alert('Imported, but some data may be too large to save in this browser.'); applyTheme(); applyBackground(); renderSection();
      } }catch(err){ alert('Invalid file.'); } };
    r.readAsText(f);
  };
  document.getElementById('resetBtn').onclick=()=>confirmModal('Reset all data','This clears every timer, alarm and setting. This cannot be undone.',()=>{
    DB=structuredClone(defaultDB); save(); applyTheme(); applyBackground(); goTo('home');
  });
}

/* =================== HOME =================== */
function renderHome(){
  const now=new Date();
  const hr=now.getHours();
  const greet= hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
  const nextAlarm = DB.alarms.filter(a=>a.enabled).sort((a,b)=>a.time.localeCompare(b.time))[0];
  const p=pomoToday();
  const timerStr = DB.timerState? fmtCD(timerRemaining(),false)+' remaining' : 'No active timer';
  const favCities = DB.worldCities.slice(0,3).map(tz=>`<div class="home-item"><span>${cityLabel(tz)}</span><b class="num">${fmtClock(now,tz)}</b></div>`).join('') || `<div class="empty" style="padding:16px"><b>No cities yet</b>Add some in World Clock</div>`;
  document.getElementById('main').innerHTML=`
  <div class="home-hero">
    ${DB.settings.clockStyle==='analogue'? `<div style="width:130px">${analogueFace(now,undefined,130)}</div>` : `<div class="time num">${fmtClock(now)}</div>`}
    <div class="greet">${greet}. It's ${new Intl.DateTimeFormat('en-US',{weekday:'long',day:'numeric',month:'long'}).format(now)}.</div>
  </div>
  <div class="grid cols2">
    <div class="card"><div class="home-item"><div><div class="l">Next alarm</div><div class="v">${nextAlarm? nextAlarm.time+' — '+(nextAlarm.label||'Alarm') : 'None set'}</div></div></div></div>
    <div class="card"><div class="home-item"><div><div class="l">Active timer</div><div class="v">${timerStr}</div></div></div></div>
    <div class="card"><div class="home-item"><div><div class="l">Today's focus</div><div class="v">${Math.floor(p.focusMin/60)}h ${p.focusMin%60}m</div></div></div></div>
    <div class="card"><div class="home-item"><div><div class="l">Pomodoro sessions</div><div class="v">${p.sessions} today</div></div></div></div>
  </div>
  <h1 class="title subhead">World Clock</h1>
  <div class="card" style="margin-top:10px">${favCities}</div>
  <h1 class="title subhead">Quick actions</h1>
  <div class="chips" style="justify-content:flex-start">
    <button class="chip" data-go="timer">Timer</button><button class="chip" data-go="stopwatch">Stopwatch</button>
    <button class="chip" data-go="pomodoro">Pomodoro</button><button class="chip" data-go="alarms">Alarm</button>
    <button class="chip" data-go="worldclock">World Clock</button>
  </div>`;
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>goTo(b.dataset.go));
}

/* ---------- section dispatch ---------- */
const RENDER={home:renderHome,timer:renderTimer,stopwatch:renderStopwatch,pomodoro:renderPomodoro,worldclock:renderWorldClock,examtimer:renderExamTimer,alarms:renderAlarms,settings:renderSettings};
function renderSection(){ RENDER[current](); }
renderSection();

/* ---------- global tick loop (absolute-time based) ---------- */
var _lastSec=-1;
function tickAll(){
  timerTick(); pomoTick(); swTick(); examTick(); alarmTick();
  const sec=Math.floor(Date.now()/1000);
  if(sec!==_lastSec){ _lastSec=sec; window._soft=1; try{ if(current==='home') renderHome(); else if(current==='worldclock') wcRefresh(); }finally{ window._soft=0; } } /* aligned to real second boundaries */
}
function safeTick(){ try{ tickAll(); }catch(e){ console.error(e); } }
(function frame(){ safeTick(); requestAnimationFrame(frame); })();
setInterval(safeTick,250);
document.addEventListener('visibilitychange',safeTick);
try{ const w=new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),200)']))); w.onmessage=()=>{ if(document.hidden) safeTick(); }; }catch(e){}

/* ---------- keyboard shortcuts ---------- */
document.addEventListener('keydown',e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if(e.code==='Space'){
    if(current==='timer'){ e.preventDefault(); if(!DB.timerState) timerStart(); else if(DB.timerState.paused) timerResume(); else timerPause(); }
    else if(current==='stopwatch'){ e.preventDefault(); const s=swState(); if(!s.running && s.elapsedBefore===0){s.running=true;s.startAt=Date.now();save();renderSection();} else if(s.running){s.elapsedBefore+=Date.now()-s.startAt;s.running=false;save();renderSection();} else {s.running=true;s.startAt=Date.now();save();renderSection();} }
    else if(current==='pomodoro'){ e.preventDefault(); if(!DB.pomoState) pomoStart('work'); else if(DB.pomoState.paused) pomoResume(); else pomoPause(); }
    else if(current==='examtimer' && DB.examState && !DB.examState.finished){ e.preventDefault(); DB.examState.paused? examResume(): examPause(); }
  }
  if(e.key==='r'||e.key==='R'){
    if(current==='timer') timerReset();
    else if(current==='stopwatch'){DB._sw={running:false,startAt:0,elapsedBefore:0,laps:[]};save();renderSection();}
    else if(current==='pomodoro' && DB.pomoState){ DB.pomoState=null; save(); renderSection(); }
  }
  if(e.key==='l'||e.key==='L'){ if(current==='stopwatch'){ const s=swState(); if(s.running){s.laps.push(swElapsed());save();renderSection();} } }
  if(e.key==='Escape'){ closeModal(); }
});
</script>
</body>
</html>
